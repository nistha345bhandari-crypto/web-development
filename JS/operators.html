<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        //arithmetic
        var a=10
        var b=3
        console.log(a+b)
        console.log(a-b)
        console.log(a/b)
        console.log(a*b)
        console.log(a%b)
        //assignment 
        console.log(a+=1)
        //-= *= /= etc
        //comparison
        console.log(a>=b)
        console.log(a<=b)
        console.log(a==b)
        console.log(a!=b)
        //logical
        console.log(a&&b)
        console.log(a||b)
        console.log(!(a==b))
//modern js
        //text variables 
        //backtick
        var name="nistha"
        console.log(
        `Dear ${name},
           Good evening!


        `)
        
    </script>
</body>
</html>
